<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla landing page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #171a20;
    }

    
    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: black;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: #171a20;
      font-size: 14px;
    }

    .icon-rail {
      display: flex;
      gap: 10px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }

    .icon-button:hover {
      background: #eee;
    }

    
    .hero {
      height: 650px;
      background: url("https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8")
        center / cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .hero-content h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero-content p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .button {
      padding: 14px 30px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: white;
      color: black;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.8);
      color: black;
    }

    
    .products {
      padding: 70px 40px;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 36px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product-card {
      border-radius: 15px;
      overflow: hidden;
      background: #f5f5f5;
    }

    .product-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      margin-bottom: 10px;
    }

    
    .feature-banner {
      padding: 80px;
      background: #eee;
      text-align: center;
    }

    .feature-banner h2 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    
    footer {
      padding: 50px 40px;
      background: #171a20;
      color: white;
      text-align: center;
    }

    
    .floating-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: white;
      padding: 8px;
      border-radius: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      z-index: 200;
    }

    .chat-input {
      border: none;
      outline: none;
      padding: 12px 20px;
      border-radius: 30px;
      width: 250px;
    }

    .schedule-button {
      border: none;
      border-radius: 30px;
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>


  <div id="root"></div>


</body>
</html>
